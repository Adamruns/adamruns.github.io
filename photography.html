  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="index.html" aria-label="Adam Smith, home"
        >adam<span class="logo-star" aria-hidden="true">✳</span></a

      <nav id="site-nav" class="site-nav" aria-label="Main navigation">

        aria-expanded="false"
        aria-controls="site-nav"

    <main id="main" class="section-wrap">
      <section class="gallery-intro">
        <h1>Photos</h1>
        <p>Some photos I’ve taken, mostly on hikes and trips.</p>
      </section>
      <div class="gallery-grid">
        <button class="photo-button" type="button" data-photo="0">
          <img
            src="assets/img/optimized/img_8769.webp"
            alt="Pine cones and delicate spider webs in mountain fog"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="1">
          <img
            src="assets/img/optimized/img_8172.webp"
            alt="Dried wildflowers glowing in warm afternoon light"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="2">
          <img
            src="assets/img/optimized/img_8774.webp"
            alt="Friends taking a break on a foggy mountain hike"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="3">
          <img
            src="assets/img/optimized/img_8420.webp"
            alt="A black and white cat looking toward the window"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="4">
          <img
            src="assets/img/optimized/img_8166.webp"
            alt="Sunlight through winter trees along a mossy stone wall"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="5">
          <img
            src="assets/img/optimized/img_8433.webp"
            alt="A pothos plant silhouetted against a window"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="6">
          <img
            src="assets/img/optimized/img_4578.webp"
            alt="A carpenter bee among yellow spring flowers"
            loading="lazy"
            width="900"
            height="1200"
          />
        </button>
        <button class="photo-button" type="button" data-photo="7">
          <img
            src="assets/img/optimized/img_8424.webp"
            alt="Crepe myrtle bark beside a campus walkway"
            loading="lazy"
            width="900"
            height="1200"
          />

            loading="lazy"
            width="900"
            height="1200"

    </main>
    <footer class="site-footer">
      <p>© <span data-year>2026</span> Adam Smith</p>
      <nav aria-label="Elsewhere">
        <a href="mailto:adamruns27@gmail.com">Email</a>
        <a href="https://www.linkedin.com/in/adam-robert-smith/">LinkedIn</a>
        <a href="https://github.com/adamruns">GitHub</a>
        <a href="https://x.com/tokensmax">X</a>
      </nav>
    </footer>
    <dialog
      id="photo-dialog"
      class="photo-dialog"
      aria-label="Photograph viewer"
    >
      <button class="dialog-close" type="button" aria-label="Close photograph">
        ×
      </button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <div class="photo-controls">
        <button type="button" data-photo-prev aria-label="Previous photograph">
          ←</button
        ><span id="photo-count"></span
        ><button type="button" data-photo-next aria-label="Next photograph">
          →
        </button>
      </div>
    </dialog>
